name: Build Plugin
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

# Read by default; only the job that creates the release is granted write.
permissions:
  contents: read

# Two pushes in quick succession would otherwise race to create the same release. Queued rather
# than cancelled: cancelling mid-publish can leave a release created with its asset missing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Slskd
  PLUGIN_VERSION: 1.1.7.0
  # The oldest Lidarr each build supports. Each framework gets its own release, and Lidarr's PluginService reads
  # "Minimum Lidarr Version:" from that release's notes and skips it on an older Lidarr. One release with both zips
  # could only state one minimum. Keep these in step with minimum_lidarr in the build matrix.
  MINIMUM_LIDARR_VERSION: 3.1.5.5066
  MINIMUM_LIDARR_VERSION_NET10: 4.0.0.5222

jobs:
  build:
    # Lidarr installs the release asset named for its own .NET version (Lidarr.Plugin.Slskd.net8.0.zip on Lidarr 3.x,
    # .net10.0.zip on Lidarr 4.x). Each build compiles against the matching Lidarr source and gets its own release.
    # The explicit name keeps the check called "build (net8.0)" as before; with include entries the matrix would
    # otherwise name the job after every value.
    name: build (${{ matrix.framework }})
    strategy:
      matrix:
        include:
          - framework: net8.0
            dotnet: 8.0.421
            # empty: use the src/Lidarr submodule as committed (3.x)
            lidarr_ref: ''
            minimum_lidarr: 3.1.5.5066
          - framework: net10.0
            dotnet: 10.0.404
            # Lidarr 4.0.0.5222 on develop, which has no tags for nightlies
            lidarr_ref: ddf8080fac613433354d4ee6a36a768148f7099e
            minimum_lidarr: 4.0.0.5222
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check out Lidarr ${{ matrix.lidarr_ref }}
        if: matrix.lidarr_ref != ''
        # by URL, because the submodule's own remote is an SSH address
        run: |
          git -C src/Lidarr fetch --depth 1 https://github.com/Lidarr/Lidarr.git ${{ matrix.lidarr_ref }}
          git -C src/Lidarr checkout FETCH_HEAD
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Create global.json
        run: |
          echo '{"sdk":{"version": "${{ matrix.dotnet }}"}}' > ./global.json
      - name: Generate metadata
        id: gen_meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" | tr '/' '-'  >> $GITHUB_OUTPUT
      - name: Update Version Info
        run: |
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$PLUGIN_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${{ steps.gen_meta.outputs.branch }}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>${{ matrix.minimum_lidarr }}<\/AssemblyVersion>/g" src/Lidarr/src/Directory.Build.props
      - name: Build
        # -f for Lidarr's multi-targeted projects, PluginTargetFramework for the plugin (see src/Directory.Build.props)
        run: dotnet publish src/*.sln -c Release -f ${{ matrix.framework }} -p:PluginTargetFramework=${{ matrix.framework }} -p:NuGetAudit=false
      - name: Upload net core
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.framework }}
          path: ./${{ env.PLUGIN_NAME }}.${{ matrix.framework }}.zip
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history so the notes can diff against the previous tag. The release tag itself does
      # not exist yet, so the newest tag present is the previous release.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          # net8.0 and net10.0; merged so both zips land in the workspace root
          pattern: net*
          merge-multiple: true
      - name: Compose release notes
        # One set of notes per framework, because the "Minimum Lidarr Version" line differs. The previous release is the
        # newest plain v* tag: the net10.0 release's "-net10.0" tag is left out so both diff against the same base.
        run: |
          previous=$(git for-each-ref --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*' | grep -v -- '-net' | head -n 1)
          for fw in net8.0 net10.0; do
            if [ "$fw" = net8.0 ]; then
              minimum=${{ env.MINIMUM_LIDARR_VERSION }}
              lidarr="Lidarr 3.x"
              tag=v${{ env.PLUGIN_VERSION }}
            else
              minimum=${{ env.MINIMUM_LIDARR_VERSION_NET10 }}
              lidarr="Lidarr 4.x"
              tag=v${{ env.PLUGIN_VERSION }}-net10.0
            fi
            {
              echo "Adds Slskd (Soulseek) to Lidarr as both an indexer and a download client. Both have"
              echo "to be added in Lidarr; see the [readme](https://github.com/${{ github.repository }}#readme) for setup."
              echo
              echo "This is the $fw build for $lidarr. Requires slskd 0.26.0 or newer."
              echo
              # Parsed out of this body by Lidarr's PluginService to decide whether the release may
              # be offered, so the wording of this line is load bearing.
              echo "Minimum Lidarr Version: $minimum"
              echo
              if [ -n "$previous" ]; then
                echo "### Changes since $previous"
                echo
                git log --no-merges --pretty=format:'- %s (`%h`)' "$previous..HEAD"
                echo
                echo
                echo "[Full changelog](https://github.com/${{ github.repository }}/compare/$previous...$tag)"
              else
                echo "### Changes"
                echo
                git log --no-merges --pretty=format:'- %s (`%h`)'
                echo
              fi
            } > "release-notes.$fw.md"
          done
      - name: Create releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One draft per framework: v<version> with the net8.0 zip for Lidarr 3.x, and v<version>-net10.0 with the
          # net10.0 zip for Lidarr 4.x. Lidarr reads "1.1.7.0-net10.0" as version 1.1.7.0 with the suffix net10.0,
          # which ranks just below a plain 1.1.7.0, so an installed 1.1.7.0 shows no false update and 1.1.7.1 still does.
          for fw in net8.0 net10.0; do
            if [ "$fw" = net8.0 ]; then
              TAG=v${{ env.PLUGIN_VERSION }}
              title="Slskd Plugin (Lidarr 3.x)"
            else
              TAG=v${{ env.PLUGIN_VERSION }}-net10.0
              title="Slskd Plugin (Lidarr 4.x)"
            fi

            # Drafts left by earlier pushes of this same version are replaced rather than duplicated,
            # since pushing to main repeatedly before publishing is the normal way to work. They are
            # found by filtering the release list on tag_name: a draft owns no git tag yet, so any
            # tag-based lookup resolves it unreliably, including gh release view, which is what makes
            # its isDraft answer untrustworthy here. The list is read into a variable before looping,
            # so that a failing API call still fails the step and the loop runs in this shell, where
            # what it finds can decide what happens next.
            releases=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")

            published=false
            while read -r id draft; do
              [ -n "$id" ] || continue
              if [ "$draft" = "true" ]; then
                echo "Replacing stale draft $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              elif ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
                # Published in name only: a release whose tag was never created is the remnant of a
                # create or publish that failed halfway, and without a tag no user can ever have seen
                # or installed it. A release that truly went out always owns its tag.
                echo "Replacing tagless release $id left by a failed publish"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              else
                published=true
              fi
            done <<< "$releases"

            # A published release is never touched. Reaching one means this push carries no new
            # version, which is how documentation and other unreleased changes land on main, so it
            # releases nothing and says so as a warning on the run rather than failing it. A forgotten
            # bump on a code change shows up through the same warning.
            if [ "$published" = "true" ]; then
              echo "::warning::$TAG is already published, so this push releases nothing for $fw. Bump PLUGIN_VERSION to release it."
              continue
            fi

            # --target names a branch rather than a sha on purpose: Lidarr only offers an update when
            # the release points at a branch called main or master, a sha reads to it as an unknown
            # tree, and GitHub degrades a sha back into the raw value once history moves past it.
            gh release create "$TAG" \
              --target "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file "release-notes.$fw.md" \
              --draft \
              --prerelease \
              "$PLUGIN_NAME.$fw.zip"
          done
