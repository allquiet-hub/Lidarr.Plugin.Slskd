name: Build Plugin
on:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.Slskd
  PLUGIN_VERSION: 1.1.1.0
  MINIMUM_LIDARR_VERSION: 3.0.0.4855
  DOTNET_VERSION: 8.0.421

jobs:
  build:
    strategy:
      matrix:
        framework: [ net8.0 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Create global.json
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json
      - name: Generate metadata
        id: gen_meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" | tr '/' '-'  >> $GITHUB_OUTPUT
      - name: Update Version Info
        run: |
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$PLUGIN_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${{ steps.gen_meta.outputs.branch }}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" src/Lidarr/src/Directory.Build.props
      - name: Build
        run: dotnet publish src/*.sln -c Release -f ${{ matrix.framework }} -p:NuGetAudit=false
      - name: Upload net core
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}
          path: ./${{ env.PLUGIN_NAME }}.${{ matrix.framework }}.zip
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Full history so the notes can diff against the previous tag. The release tag itself does
      # not exist yet, so the newest tag present is the previous release.
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Download Artifact (net8.0)
        uses: actions/download-artifact@v4
        with:
          name: net8.0
      - name: Compose release notes
        id: notes
        run: |
          previous=$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "Adds Slskd (Soulseek) to Lidarr as both an indexer and a download client. Both have"
            echo "to be added in Lidarr; see the [readme](https://github.com/${{ github.repository }}#readme) for setup."
            echo
            echo "Requires Lidarr \`nightly\` and slskd 0.26.0 or newer."
            echo
            # Parsed out of this body by Lidarr's PluginService to decide whether the release may
            # be offered, so the wording of this line is load bearing.
            echo "Minimum Lidarr Version: ${{ env.MINIMUM_LIDARR_VERSION }}"
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$previous..HEAD"
              echo
              echo
              echo "[Full changelog](https://github.com/${{ github.repository }}/compare/$previous...v${{ env.PLUGIN_VERSION }})"
            else
              echo "### Changes"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)'
              echo
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.PLUGIN_VERSION }}
          # Lidarr only offers an update when the release points at a branch named main or
          # master; a commit sha reads as an unknown tree and the release is skipped. GitHub
          # also degrades a sha back into the raw value once history moves past it.
          commitish: ${{ github.ref_name }}
          name: Slskd Plugin
          body: ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: true
          files: >
            ${{ env.PLUGIN_NAME }}.net8.0.zip
          gzip: false
